# 기본 환경변수는 .env로 주입하세요.
# 로컬 테스트용 값은 기본값으로 남겨두었습니다.

spring:
  application:
    name: order-settlement-async

  datasource:
    url: ${DB_URL:jdbc:h2:mem:order_settlement;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER_CLASS:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    database-platform: ${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
  flyway:
    locations: ${SPRING_FLYWAY_LOCATIONS:classpath:db/migration/h2}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:order-settlement-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      concurrency: ${KAFKA_CONSUMER_CONCURRENCY:2}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

server:
  port: ${SERVER_PORT:8080}

app:
  kafka:
    topics:
      order-created: ${KAFKA_TOPIC_ORDER_CREATED:order-created.v1}
      order-created-dlt: ${KAFKA_TOPIC_ORDER_CREATED_DLT:order-created.v1-dlt}
      auto-create: ${KAFKA_TOPIC_AUTO_CREATE:true}
      partitions: ${KAFKA_TOPIC_PARTITIONS:3}
      replicas: ${KAFKA_TOPIC_REPLICAS:1}
    retry:
      initial-interval-ms: ${KAFKA_RETRY_INITIAL_INTERVAL_MS:1000}
      multiplier: ${KAFKA_RETRY_MULTIPLIER:2.0}
      max-interval-ms: ${KAFKA_RETRY_MAX_INTERVAL_MS:10000}
      max-elapsed-time-ms: ${KAFKA_RETRY_MAX_ELAPSED_TIME_MS:120000}
    metrics:
      log-every: ${KAFKA_LOG_EVERY:1000}

infra:
  kafka-bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  consumer-group: ${KAFKA_CONSUMER_GROUP:order-settlement-group}
